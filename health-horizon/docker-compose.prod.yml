services:
  postgres:
    image: postgres:15
    container_name: health-horizon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - health_horizon_db:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    image: 882597581176.dkr.ecr.ap-south-1.amazonaws.com/health-horizon-ml:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: health-horizon-ml
    restart: unless-stopped
    expose:
      - "5000"
    networks:
      - app-network

  backend:
    image: 882597581176.dkr.ecr.ap-south-1.amazonaws.com/health-horizon-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: health-horizon-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY: ${JWT_EXPIRY:-86400000}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      ML_SERVICE_URL: http://ml-service:5000
      UPLOAD_DIR: /app/uploads
    volumes:
      - health_horizon_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/actuator/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: 882597581176.dkr.ecr.ap-south-1.amazonaws.com/health-horizon-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: health-horizon-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  health_horizon_db:
  health_horizon_uploads:

networks:
  app-network:
    driver: bridge
