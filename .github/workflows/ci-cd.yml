name: Health Horizon CI/CD

on:
  push:
    branches:
      - main
      - devops-implementation

  pull_request:
    branches:
      - main
      - devops-implementation

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-horizon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            health-horizon/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: health-horizon
        run: npm ci

      - name: Validate backend JavaScript syntax
        working-directory: health-horizon
        run: |
          find . -path './node_modules' -prune -o \
            -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate ML service Python syntax
        run: python -m py_compile health-horizon/ml-service/app.py

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./health-horizon
          file: ./health-horizon/Dockerfile
          push: false
          tags: health-horizon-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: health-horizon-frontend:${{ github.sha }}

      - name: Build ML service image
        uses: docker/build-push-action@v6
        with:
          context: ./health-horizon/ml-service
          file: ./health-horizon/ml-service/Dockerfile
          push: false
          tags: health-horizon-ml:${{ github.sha }}

  publish-ecr:
    name: Publish Images to Amazon ECR
    runs-on: ubuntu-latest
    needs: [validate, docker-build]
    timeout-minutes: 30

    # Publishing is enabled only after AWS OIDC is configured.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/devops-implementation' &&
      vars.AWS_ROLE_ARN != ''

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./health-horizon
          file: ./health-horizon/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/health-horizon-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/health-horizon-frontend:${{ github.sha }}

      - name: Build and push ML service image
        uses: docker/build-push-action@v6
        with:
          context: ./health-horizon/ml-service
          file: ./health-horizon/ml-service/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/health-horizon-ml:${{ github.sha }}
