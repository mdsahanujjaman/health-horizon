define command {
    command_name    check_hh_frontend
    command_line    /usr/lib/nagios/plugins/check_http -H 127.0.0.1 -p 80 -u /
}

define command {
    command_name    check_hh_backend
    command_line    /usr/lib/nagios/plugins/check_http -H 127.0.0.1 -p 8081 -u /actuator/health -s '"status":"UP"'
}

define host {
    host_name               health-horizon
    alias                   Health Horizon Application
    address                 127.0.0.1
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    check_command           check-host-alive
    notifications_enabled   0
    notification_interval   30
    notification_period     24x7
    notification_options    d,u,r
}

define service {
    use                     generic-service
    host_name               health-horizon
    service_description     Frontend HTTP
    check_command           check_hh_frontend
    notifications_enabled   0
    check_interval          1
    retry_interval          1
}

define service {
    use                     generic-service
    host_name               health-horizon
    service_description     Backend API and Database Health
    check_command           check_hh_backend
    notifications_enabled   0
    check_interval          1
    retry_interval          1
}

define command {
    command_name    check_hh_ml
    command_line    /usr/lib/nagios/plugins/check_http -H 127.0.0.1 -p 5000 -u /health -s '"status":"healthy"'
}

define service {
    use                     generic-service
    host_name               health-horizon
    service_description     ML Service Health
    check_command           check_hh_ml
    check_interval          1
    retry_interval          1
    notifications_enabled   0
}
